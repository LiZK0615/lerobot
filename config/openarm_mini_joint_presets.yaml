schema_version: 1

# Joint values use the OpenArm follower ROS convention: joints in radians,
# grippers in metres. The Mini write path applies side flips and J6/J7 remap.
max_joint_velocity_rad_s: 0.35
minimum_segment_duration_sec: 3.0
waypoint_pause_sec: 0.5
# Both Mini leaders and OpenArm followers must satisfy this same final gate.
target_tolerance_rad: 0.10

# During recording, opening a Mini gripper releases that side for the rest of
# the episode; closing it does not re-enable torque. After engagement, both
# grippers closed and a quiet window trigger an automatic direct return.
gripper_closed_threshold_deg: -3.0
auto_return_idle_duration_sec: 0.5
auto_return_idle_joint_delta_deg: 2.0

prepare_sequence:
  - table_clearance
  - table_ready

waypoints:
  table_clearance:
    left:  [0.10, 0.0, 0.0, 0.00, 0.0, 0.0, -0.80, 0.0]
    right: [-0.10, 0.0, 0.0, 0.00, 0.0, 0.0,  0.80, 0.0]

  table_ready:
    left:  [0.72, 0.0, 0.0, 1.15, 0.0, 0.0, -1.10, 0.0]
    right: [-0.72, 0.0, 0.0, 1.15, 0.0, 0.0,  1.10, 0.0]
